# yaml-language-server: $schema=./partition.schema.json
# In docs/partition.yml, the line above reads $schema=../.claude/skills/partition-budget/assets/partition.schema.json (.agents for copilot).
# Partition - project configuration.
# Strict YAML subset: block maps and lists, one value per line, flow lists [a, b] of plain values.
# Put quotes around a value that holds ": " or starts with * & !

version: 1
target: claude                # whose loading rules the gauges follow: claude | copilot
bridge: none                  # none, or the tool that writes the plans' body (superpowers, bmad, ...): information only

paths:
  specs: docs/specs
  invariants: docs/specs/invariants.md
  plans: docs/plans
  contracts: docs/contracts
  sources: docs/sources        # PRDs and described contexts, decomposed by partition-shape
  # schemas: docs/schema      # declare it only if the project documents its persistence

budget:
  always: 32000               # the owner's limit: no bounded context may load more tokens than this before reading code
  chars_per_token: 4
  review: quarterly           # when the assessment is held, e.g. quarterly, every six sprints

contexts:
  - id: orders                # one entry per bounded context
    area: sales               # its area; leave it out for a bounded context in no area
    # spec: ../shared/specs/orders  # leave it out for docs/specs/sales/orders; set it only to point elsewhere
    code:                     # decides which scoped rules apply; not counted
      - src/orders/**
    hexagons:
      - id: orders
        form: thin            # thin | rich
        reason: reads and writes two tables, no state to protect
        layers:
          inbound: src/orders/inbound/**
          application: src/orders/application/**
          outbound: src/orders/outbound/**
        allowed:
          - inbound -> application
          - outbound -> application   # outbound implements the ports the application defines
