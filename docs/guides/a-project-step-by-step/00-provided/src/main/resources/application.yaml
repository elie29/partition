spring:
  output.ansi.enabled: always
  application:
    name: commerce

  datasource:
    url: jdbc:h2:file:./.local/h2/commerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      discovery:
        enabled: true
      exposure:
        include: 'health,info,metrics'
  endpoint:
    health:
      show-details: always
