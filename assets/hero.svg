<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Partition: the living specification and the Context Budget as agent skills</title>
  <desc id="d">A musical staff runs across the picture, cut by bar lines into five measures named after bounded contexts: Orders, Catalogue, Billing, Shipping and Stock. The Billing measure is filled: it is the one context the assistant holds in full, at 21 000 of its 32 000 tokens. The others are known only through their contracts. Behind the staff, faintly, runs the opening melody of Erik Satie’s Gymnopédie No. 1.</desc>
