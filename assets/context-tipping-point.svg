<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">The tension: the context grows, the answers lose relevance</title>
  <desc id="d">Two curves over time, as the project grows. The context to hold rises; the relevance of the assistant's answers falls. At first the assistant works wonders. The curves cross at the tipping point, beyond which each request costs more and returns less. The model does not change: with the same model, accuracy drops as the context gets longer.</desc>
  <defs>
    <style>
      .sans { font-family: 'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7a8291"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="16" fill="#0f1218"/>
  <rect x="1" y="1" width="1278" height="718" rx="15" fill="none" stroke="#5b6472" stroke-width="2"/>
  <text x="40" y="66" class="sans" font-size="30" font-weight="600" fill="#eceef2">The tension: the context grows, the answers lose relevance</text>
  <text x="40" y="104" class="sans" font-size="18" fill="#aab0ba">The model does not change: with the same model, accuracy drops as the context gets longer.</text>

  <!-- Beyond the tipping point -->
  <rect x="786.5" y="160" width="317.5" height="424" fill="#e8a93a" fill-opacity="0.1"/>

  <!-- Grid and axes -->
  <path d="M112 272H1104M112 376H1104M112 480H1104" stroke="#2a303a" stroke-width="1.5"/>
  <path d="M112 584H1126" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M112 584V144" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="100" y="180" class="sans" font-size="17" fill="#aab0ba" text-anchor="end">High</text>
  <text x="100" y="584" class="sans" font-size="17" fill="#aab0ba" text-anchor="end">Low</text>
  <text x="1134" y="618" class="sans" font-size="17" fill="#aab0ba" text-anchor="end">Time, size of the project</text>

  <!-- Curves -->
  <path d="M112 556C528 548 832 416 1104 188" fill="none" stroke="#e8a93a" stroke-width="5" stroke-linecap="round"/>
  <path d="M112 200C496 204 768 416 1104 540" fill="none" stroke="#4cc9f0" stroke-width="5" stroke-linecap="round"/>
  <text x="1116" y="194" class="sans" font-size="19" font-weight="600" fill="#f5cd7a">Context</text>
  <text x="1116" y="546" class="sans" font-size="19" font-weight="600" fill="#4cc9f0">Relevance</text>

  <!-- Tipping point -->
  <path d="M786.5 160V584" stroke="#7a8291" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="786.5" cy="399.4" r="9" fill="#eceef2" stroke="#0f1218" stroke-width="3"/>
  <text x="798" y="186" class="sans" font-size="21" font-weight="600" fill="#eceef2">Tipping point</text>
  <text x="136" y="488" class="sans" font-size="19" fill="#aab0ba">The assistant works wonders</text>
  <text x="806" y="530" class="sans" font-size="19" fill="#eceef2">Each request costs more</text>
  <text x="806" y="556" class="sans" font-size="19" fill="#eceef2">and returns less</text>

  <!-- Legend -->
  <path d="M40 665H72" stroke="#e8a93a" stroke-width="5" stroke-linecap="round"/>
  <text x="84" y="671" class="sans" font-size="17" fill="#eceef2">Context to hold</text>
  <path d="M320 665H352" stroke="#4cc9f0" stroke-width="5" stroke-linecap="round"/>
  <text x="364" y="671" class="sans" font-size="17" fill="#eceef2">Relevance of the assistant's answers</text>
</svg>
