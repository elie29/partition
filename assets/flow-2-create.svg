<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1232" role="img" aria-labelledby="t d">
  <title id="t">Journey 2: create a bounded context</title>
  <desc id="d">Two ways in. When a source describes the context, you give it as a file, the assistant decomposes it, stops to show the split for you to validate by name, then writes one spec per context that points to the source and copies its stated rules under a TO VALIDATE banner. With no source, it declares the context, starts its spec with the business rules left to fill, and you write its language. Then you confirm and fill the business rules, the spec is attacked before planning, its hexagon form and C4 container are chosen, and it is delivered through a plan, in journey 3.</desc>
  <defs>
    <style>
      .sans { font-family: 'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'IBM Plex Mono','Cascadia Mono',Consolas,Menlo,monospace; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7a8291"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4cc9f0"/>
    </marker>
  </defs>
  <rect width="1280" height="1232" rx="16" fill="#0f1218"/>
  <rect x="1" y="1" width="1278" height="1230" rx="15" fill="none" stroke="#5b6472" stroke-width="2"/>
  <circle cx="58" cy="56" r="18" fill="#0b78a0"/>
  <text x="58" y="62.84" class="sans" font-size="20" font-weight="700" fill="#eceef2" text-anchor="middle">2</text>
  <text x="90" y="66" class="sans" font-size="30" font-weight="600" fill="#eceef2">Create a bounded context</text>
  <text x="40" y="104" class="sans" font-size="18" fill="#aab0ba">From a source when one exists. Nothing is written before you validate it, and no business rule is ever deduced.</text>
  <text x="40" y="150" class="sans" font-size="17" font-weight="600" fill="#eceef2">A source describes it</text>
  <text x="40" y="172" class="sans" font-size="15" fill="#9aa2ae">an API contract, a PRD, an existing spec, a context described in the chat</text>
  <path d="M40 184H800" stroke="#5b6472" stroke-width="2"/>
  <text x="840" y="150" class="sans" font-size="17" font-weight="600" fill="#eceef2">No source to decompose</text>
  <text x="840" y="172" class="sans" font-size="15" fill="#9aa2ae">a workshop record, your answers</text>
  <path d="M840 184H1240" stroke="#5b6472" stroke-width="2"/>
  <rect x="40" y="206" width="760" height="100" rx="8" fill="#1f1a12" stroke="#8a6a2e" stroke-width="2"/>
  <circle cx="70" cy="234" r="14" fill="#e8a93a"/>
  <text x="70" y="239.32" class="sans" font-size="15" font-weight="700" fill="#0f1218" text-anchor="middle">A</text>
  <text x="96" y="240" class="sans" font-size="19" font-weight="600" fill="#f5cd7a">You give the source as a file</text>
  <text x="96" y="263" class="sans" font-size="16" fill="#aab0ba">Pasted in the chat, it is saved first, and you validate it.</text>
  <text x="96" y="286" class="sans" font-size="16" fill="#aab0ba">Committed alone, under a stable name.</text>
  <text x="778" y="263" class="mono" font-size="14" fill="#9aa2ae" text-anchor="end">docs/sources/ · docs/contracts/</text>
  <path d="M70 306L70 330" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="40" y="332" width="760" height="123" rx="8" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <circle cx="70" cy="360" r="14" fill="#0b78a0"/>
  <text x="70" y="365.32" class="sans" font-size="15" font-weight="700" fill="#eceef2" text-anchor="middle">B</text>
  <text x="96" y="366" class="sans" font-size="19" font-weight="600" fill="#eceef2">Decompose it</text>
  <text x="778" y="366" class="mono" font-size="15" fill="#4cc9f0" text-anchor="end">partition-shape</text>
  <text x="96" y="389" class="sans" font-size="16.5" font-style="italic" fill="#4cc9f0">“Decompose billing-prd.md, area billing.”</text>
  <text x="96" y="412" class="sans" font-size="16" fill="#aab0ba">Source and area are named by you, never inferred. Every unit is</text>
  <text x="96" y="435" class="sans" font-size="16" fill="#aab0ba">inventoried, then weighed against the six written criteria.</text>
  <path d="M70 455L70 479" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="40" y="481" width="760" height="100" rx="8" fill="#1f1a12" stroke="#8a6a2e" stroke-width="2"/>
  <circle cx="70" cy="509" r="14" fill="#e8a93a"/>
  <text x="70" y="514.32" class="sans" font-size="15" font-weight="700" fill="#0f1218" text-anchor="middle">C</text>
  <text x="96" y="515" class="sans" font-size="19" font-weight="600" fill="#f5cd7a">Hard stop: you validate the split</text>
  <text x="96" y="538" class="sans" font-size="16" fill="#aab0ba">The contexts, what each owns, the rules copied word for word, the gaps.</text>
  <text x="96" y="561" class="sans" font-size="16" fill="#aab0ba">Each new context is validated by name; “go ahead” does not cover it.</text>
  <path d="M70 581L70 605" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="40" y="607" width="760" height="100" rx="8" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <circle cx="70" cy="635" r="14" fill="#0b78a0"/>
  <text x="70" y="640.32" class="sans" font-size="15" font-weight="700" fill="#eceef2" text-anchor="middle">D</text>
  <text x="96" y="641" class="sans" font-size="19" font-weight="600" fill="#eceef2">One spec per context, pointing to its source</text>
  <text x="778" y="641" class="mono" font-size="15" fill="#4cc9f0" text-anchor="end">partition-shape</text>
  <text x="96" y="664" class="sans" font-size="16" fill="#aab0ba">Source parts owned, with links. The rules, invariants and decisions the source states are</text>
  <text x="96" y="687" class="sans" font-size="16" fill="#aab0ba">copied under “TO VALIDATE”, once: a rule several contexts share, to its owner or area file.</text>
  <rect x="840" y="206" width="400" height="100" rx="8" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <circle cx="870" cy="234" r="14" fill="#0b78a0"/>
  <text x="870" y="239.32" class="sans" font-size="15" font-weight="700" fill="#eceef2" text-anchor="middle">A</text>
  <text x="896" y="240" class="sans" font-size="19" font-weight="600" fill="#eceef2">Declare the context</text>
  <text x="1218" y="240" class="mono" font-size="15" fill="#4cc9f0" text-anchor="end">partition-spec</text>
  <text x="896" y="263" class="sans" font-size="16" fill="#aab0ba">Its id, its area, its spec, its code paths.</text>
  <text x="896" y="286" class="sans" font-size="16" fill="#aab0ba">It asks for the paths; it never guesses.</text>
  <path d="M870 306L870 330" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="840" y="332" width="400" height="123" rx="8" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <circle cx="870" cy="360" r="14" fill="#0b78a0"/>
  <text x="870" y="365.32" class="sans" font-size="15" font-weight="700" fill="#eceef2" text-anchor="middle">B</text>
  <text x="896" y="366" class="sans" font-size="19" font-weight="600" fill="#eceef2">Start its spec</text>
  <text x="1218" y="366" class="mono" font-size="15" fill="#4cc9f0" text-anchor="end">partition-spec</text>
  <text x="896" y="389" class="sans" font-size="16" fill="#aab0ba">Only what a source establishes is</text>
  <text x="896" y="412" class="sans" font-size="16" fill="#aab0ba">filled; the rest becomes open questions.</text>
  <text x="896" y="435" class="sans" font-size="16" fill="#aab0ba">Business rules stay “TO FILL”.</text>
  <path d="M870 455L870 479" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="840" y="481" width="400" height="77" rx="8" fill="#1f1a12" stroke="#8a6a2e" stroke-width="2"/>
  <circle cx="870" cy="509" r="14" fill="#e8a93a"/>
  <text x="870" y="514.32" class="sans" font-size="15" font-weight="700" fill="#0f1218" text-anchor="middle">C</text>
  <text x="896" y="515" class="sans" font-size="19" font-weight="600" fill="#f5cd7a">You write its language</text>
  <text x="896" y="538" class="sans" font-size="16" fill="#aab0ba">One meaning per word, no synonym.</text>
  <path d="M70 707L70 755" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M870 558L870 755" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="40" y="757" width="1200" height="100" rx="8" fill="#1f1a12" stroke="#8a6a2e" stroke-width="2"/>
  <circle cx="70" cy="785" r="14" fill="#e8a93a"/>
  <text x="70" y="790.32" class="sans" font-size="15" font-weight="700" fill="#0f1218" text-anchor="middle">E</text>
  <text x="96" y="791" class="sans" font-size="19" font-weight="600" fill="#f5cd7a">You confirm and fill the business rules</text>
  <text x="96" y="814" class="sans" font-size="16" fill="#aab0ba">Confirm the copied rules, write the missing ones, settle the open questions and the gaps. Until the banner comes off,</text>
  <text x="96" y="837" class="sans" font-size="16" fill="#aab0ba">the context is not fit for design, and the assistant says so.</text>
  <path d="M70 857L70 881" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="40" y="883" width="1200" height="100" rx="8" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <circle cx="70" cy="911" r="14" fill="#0b78a0"/>
  <text x="70" y="916.32" class="sans" font-size="15" font-weight="700" fill="#eceef2" text-anchor="middle">F</text>
  <text x="96" y="917" class="sans" font-size="19" font-weight="600" fill="#eceef2">Attack the spec before planning</text>
  <text x="1218" y="917" class="mono" font-size="15" fill="#4cc9f0" text-anchor="end">partition-attack</text>
  <text x="96" y="940" class="sans" font-size="16.5" font-style="italic" fill="#4cc9f0">“Attack this spec before we plan.”</text>
  <text x="96" y="963" class="sans" font-size="16" fill="#aab0ba">A reader who did not write it builds the scenarios that break it. Findings go into the spec, for you to settle.</text>
  <path d="M70 983L70 1007" fill="none" stroke="#7a8291" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="40" y="1009" width="1200" height="77" rx="8" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <circle cx="70" cy="1037" r="14" fill="#0b78a0"/>
  <text x="70" y="1042.32" class="sans" font-size="15" font-weight="700" fill="#eceef2" text-anchor="middle">G</text>
  <text x="96" y="1043" class="sans" font-size="19" font-weight="600" fill="#eceef2">Choose its form</text>
  <text x="1218" y="1043" class="mono" font-size="15" fill="#4cc9f0" text-anchor="end">partition-hexagon · partition-c4</text>
  <text x="96" y="1066" class="sans" font-size="16" fill="#aab0ba">Thin or rich hexagon against your layer map; the container in the C4 model.</text>
  <path d="M70 1086L70 1116" fill="none" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="40" y="1120" width="680" height="52" rx="26" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="380" y="1153" class="sans" font-size="18" font-weight="600" fill="#4cc9f0" text-anchor="middle">Design with your process tool, then deliver → cf. journey 3</text>
  <rect x="40" y="1191" width="34" height="20" rx="5" fill="#161a22" stroke="#5b6472" stroke-width="2"/>
  <text x="86" y="1206" class="sans" font-size="15" fill="#aab0ba" text-anchor="start">the assistant, with the skill it uses</text>
  <rect x="400" y="1191" width="34" height="20" rx="5" fill="#1f1a12" stroke="#8a6a2e" stroke-width="2"/>
  <text x="446" y="1206" class="sans" font-size="15" fill="#aab0ba" text-anchor="start">you: a decision or an action only you take</text>

</svg>
