<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Same loop, two loads</title>
  <desc id="d">Two rows over the same timeline, feature 1 to feature 6, each feature the same loop: spec, plan, build, verify. In both rows the project grows feature after feature. Top row, without Partition: what the assistant loads for one task is the whole project, so the bar grows with it and passes the limit of the model from feature 4 on; the answers lose accuracy. Bottom row, with Partition: the same project, cut into bounded contexts; one task loads the always-on instruction, the rules that match, the spec of its context and that context alone, so the bar stays the same length at every feature. The project grows; the load of a task does not.</desc>
