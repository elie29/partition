  <text x="40" y="232" class="sans" font-size="20" font-weight="600" fill="#eceef2" text-anchor="start">Without Partition</text>
  <text x="40" y="256" class="sans" font-size="14" font-weight="400" fill="#aab0ba" text-anchor="start">one project, held whole</text>
  <text x="40" y="314" class="sans" font-size="14" font-weight="400" fill="#4cc9f0" text-anchor="start">what one task loads</text>
  <text x="40" y="333" class="sans" font-size="14" font-weight="400" fill="#aab0ba" text-anchor="start">grows with the project</text>
  <text x="40" y="472" class="sans" font-size="20" font-weight="600" fill="#eceef2" text-anchor="start">With Partition</text>
  <text x="40" y="496" class="sans" font-size="14" font-weight="400" fill="#aab0ba" text-anchor="start">the same project, in bounded contexts</text>
  <text x="40" y="554" class="sans" font-size="14" font-weight="400" fill="#4cc9f0" text-anchor="start">what one task loads</text>
  <text x="40" y="573" class="sans" font-size="14" font-weight="400" fill="#aab0ba" text-anchor="start">stays the same length</text>
  <line x1="852.5" y1="290" x2="852.5" y2="278" stroke="#7a8291" stroke-width="1.5"/>
  <text x="858.5" y="282" class="sans" font-size="13" font-weight="400" fill="#7a8291" text-anchor="start">the limit of the model</text>
  <text x="1240" y="350" class="sans" font-size="13" font-weight="400" fill="#f5cd7a" text-anchor="end">the answers lose accuracy</text>
  <text x="1240" y="590" class="sans" font-size="13" font-weight="400" fill="#f5cd7a" text-anchor="end">one task, one context, its contracts</text>
  <line x1="250" y1="410" x2="1240" y2="410" stroke="#2a303a" stroke-width="2"/>
  <text x="40" y="672" class="sans" font-size="17" font-weight="400" fill="#eceef2" text-anchor="start">Your project will grow. The attention of the assistant will not. Partition it, so that each task loads only what it needs.</text>
