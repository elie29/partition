<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">The project grows, the load of a task stays</title>
  <desc id="d">The demo project of the step-by-step guide at four moments, side by side. After step 04: one deployable, commerce-app, one area, billing, one bounded context, invoice. After step 08, once invoice was split at step 06, refund created at step 07 and the catalog contract read at step 08: two areas, billing with invoice, payment, refund and an area file, catalog with product, price-list and an area file, and the invariant register. After step 15, once discount was created at step 10, price-list moved at step 11, refund merged into payment at step 13, price-list into product at step 14, and discount removed at step 15: billing with invoice and payment, catalog with product, no area file left. After step 17, once the old customer spec was inherited at step 16 and payment promoted at step 17: commerce-app holds billing with invoice, catalog with product and customer with customer and fraud; payment-app holds billing with payment. Under each column, what one task of one bounded context loads: the always-on instruction, the register once it exists, the area file while one exists, the spec of the context and its scoped rules. The structure grows across the columns; the slice a task loads keeps about the same length. The guide leaves every gauge at a dash, so the figure carries no number.</desc>
