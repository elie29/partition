name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Prettier
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Tests and package checks
        run: npm test
      - name: The package's own budget
        run: npm run budget
