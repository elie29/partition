name: Bug report
description: A skill, the agent, a script or the reminder hook does something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. A vulnerability does not go here: use **Report a vulnerability** on the
        previous page.
        Before you paste a prompt or an output, remove anything that names a client or an employer.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you open it
      options:
        - label: I searched the open and closed issues, and this one is not there.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Which part
      description: The skill, agent, script or hook that did it. Pick "other or not sure" when you cannot tell.
      options:
        - always-on instruction
        - partition-attack
        - partition-budget
        - partition-c4
        - partition-shape
        - partition-gate
        - partition-hexagon
        - partition-patterns
        - partition-plan
        - partition-readme
        - partition-rules
        - partition-spec
        - partition-reshape
        - spec-auditor
        - budget.mjs
        - c4-drawio.mjs
        - contract.mjs
        - collect_change_context.sh
        - detect_test_tampering.sh
        - diff_coverage.py
        - partition-reminder.py
        - other or not sure
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Assistant
      options:
        - Claude Code
        - GitHub Copilot
        - both
    validations:
      required: true
  - type: textarea
    id: asked
    attributes:
      label: What you asked or ran
      description: The prompt you gave the assistant, or the command you ran, exactly.
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The real output, pasted. Not a summary.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: And the line of a skill or of the spec that says so, if you know it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: The smallest spec, partition.yml, model or contract that shows it. Remove anything that names a client or an employer.
      render: text
  - type: input
    id: partition-version
    attributes:
      label: Partition version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: apm-version
    attributes:
      label: APM version
      description: What `apm --version` prints.
    validations:
      required: true
  - type: input
    id: assistant-version
    attributes:
      label: Assistant version
      placeholder: Claude Code 2.1.0, or Copilot in VS Code 1.105
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
  - type: input
    id: runtime
    attributes:
      label: Node or Python version
      description: When a script or the hook is involved. What `node --version` or `python --version` prints.
